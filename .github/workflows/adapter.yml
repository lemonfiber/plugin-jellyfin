# The adapter's image builds, runs locked down the way lemonfiber runs it, and
# answers its own health check under the plugin's key. Nothing is pushed: a signed
# tag is the only thing that publishes (release.yml).
name: adapter
on: [pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  adapter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t jellyfin-adapter:check .
      - name: Runs read-only, non-root, with no capabilities, and answers its health
        run: |
          set -euo pipefail
          configuration="$(mktemp -d)"
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$configuration/lemonfiber.key"
          chmod 755 "$configuration"
          chmod 644 "$configuration/lemonfiber.key"
          docker run -d --name adapter-check --read-only --cap-drop ALL \
            --security-opt no-new-privileges -v "$configuration:/config:ro" jellyfin-adapter:check
          for _ in $(seq 1 20); do
            if docker exec adapter-check /jellyfin-adapter health; then
              docker rm -f adapter-check >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs adapter-check
          echo "::error::the image did not answer its own health check"
          exit 1
