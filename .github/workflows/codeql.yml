# CodeQL static analysis of the Rust crate, the Python tooling and the workflows (Q-R53).
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 2"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: matrix.language == 'rust'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # Runs after a failed analysis too: the gate refuses a commit it has no
  # analysis of, where a skipped required check would pass.
  alerts:
    needs: analyze
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: read
    uses: lemonfiber/spec/.github/workflows/codeql-alerts.yml@657dcf224c2e99c6f4d47c5cfb963aad043b9cd7 # v1.0.146
    with:
      analysis: ${{ needs.analyze.result }}
