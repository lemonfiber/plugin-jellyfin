[package]
name = "jellyfin-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-jellyfin"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's media.serve and identity.source contracts in front of Jellyfin"
publish = false

[[bin]]
name = "jellyfin-adapter"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
form_urlencoded = "1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-error = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee", features = ["test-support"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
regex = "1"
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
